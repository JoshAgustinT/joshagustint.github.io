<html>

<head>
  <title>Photography</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="icon" href="cat.png" type="image/x-icon" />

  <style>
    /* Gallery Styles */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1em;
    }

    .photo-block {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 0.375em;
      overflow: hidden;
      cursor: pointer; /* Lets the user know it's clickable */
    }

    .photo-block img,
    .photo-block video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease-in-out;
    }

    .photo-block:hover img,
    .photo-block:hover video {
      transform: scale(1.05); /* Slight zoom on hover */
    }

    /* Small play badge on video tiles */
    .photo-block.is-video::after {
      content: "\25B6";
      position: absolute;
      right: 0.5em;
      bottom: 0.5em;
      color: #fff;
      font-size: 0.8em;
      line-height: 1;
      padding: 0.4em 0.5em;
      border-radius: 0.25em;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    /* Modal / Lightbox Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 50px 0 20px;
      background-color: rgba(0,0,0,0.9);
      text-align: center;
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .modal-caption {
      color: #ddd;
      font-size: 0.9em;
      max-width: 90%;
      margin: 0.75em auto 0;
      white-space: pre-line; /* keep line breaks from the .txt */
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }

    /* Mobile responsiveness for grid */
    @media screen and (max-width: 768px) {
      .photo-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media screen and (max-width: 480px) {
      .photo-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="is-preload">

  <!-- Wrapper -->
  <div id="wrapper">

    <!-- Main -->
    <div id="main">
      <div class="inner">

        <!-- Content -->
        <section>
          <header class="main">
            <h1>Photography</h1>
          </header>

          <!-- Empty Gallery Container. JS will populate this. -->
          <div class="photo-gallery" id="gallery-container"></div>

        </section>

      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar"></div>
    <script src="assets/js/sidebar.js"></script>
  </div>

  <!-- The Modal / Lightbox -->
  <div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="expandedImg">
    <video class="modal-content" id="expandedVideo" controls playsinline></video>
    <p class="modal-caption" id="modalCaption"></p>
  </div>

  <!-- Scripts -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/browser.min.js"></script>
  <script src="assets/js/breakpoints.min.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/main.js"></script>

  <!-- Gallery list: generated by photos.py from the files in images/photography/ -->
  <script src="images/photography/manifest.js"></script>

  <!-- Gallery & Modal Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const PHOTO_DIR = "images/photography/";
      const photos = window.PHOTOS || [];

      const gallery = document.getElementById('gallery-container');
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('expandedImg');
      const modalVideo = document.getElementById('expandedVideo');
      const modalCaption = document.getElementById('modalCaption');
      const closeBtn = modal.querySelector('.close');
      let current = -1; // index of the item open in the lightbox

      function openModal(index) {
        current = index;
        const item = photos[index];
        modalVideo.pause();
        const src = PHOTO_DIR + item.file;
        if (item.type === "video") {
          modalImg.style.display = "none";
          modalVideo.style.display = "block";
          modalVideo.src = src;
          modalVideo.play();
        } else {
          modalVideo.style.display = "none";
          modalImg.style.display = "block";
          modalImg.src = src;
        }
        modalCaption.textContent = item.caption || "";
        modalCaption.style.display = item.caption ? "block" : "none";
        modal.style.display = "block";
      }

      function closeModal() {
        modal.style.display = "none";
        modalVideo.pause();
        modalVideo.removeAttribute("src");
        modalVideo.load();
      }

      // Build a tile for each photo/video (manifest is already largest number first)
      photos.forEach((item, index) => {
        const block = document.createElement('div');
        block.className = 'photo-block';

        let media;
        if (item.type === "video") {
          block.classList.add('is-video');
          media = document.createElement('video');
          media.src = PHOTO_DIR + item.file + "#t=0.1"; // show a first-frame thumbnail
          media.muted = true;
          media.loop = true;
          media.playsInline = true;
          media.preload = "metadata";
          // Preview on hover
          block.addEventListener('mouseenter', () => media.play().catch(() => {}));
          block.addEventListener('mouseleave', () => media.pause());
        } else {
          media = document.createElement('img');
          media.src = PHOTO_DIR + item.file;
          media.loading = "lazy"; // Helps load the page faster
        }
        media.setAttribute('aria-label', item.caption || item.file);

        block.onclick = () => openModal(index);
        block.appendChild(media);
        gallery.appendChild(block);
      });

      // Close on the (x), on a click outside the media, or with Escape; arrows go back/forward
      closeBtn.onclick = closeModal;
      modal.onclick = function(event) {
        if (event.target !== modalImg && event.target !== modalVideo && event.target !== modalCaption) {
          closeModal();
        }
      };
      document.addEventListener('keydown', function(event) {
        if (modal.style.display !== "block") return;
        if (event.key === "Escape") {
          closeModal();
        } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          event.preventDefault(); // don't let the video player seek
          const step = event.key === "ArrowRight" ? 1 : -1;
          openModal((current + step + photos.length) % photos.length); // wraps around
        }
      });
    });
  </script>

</body>
</html>
